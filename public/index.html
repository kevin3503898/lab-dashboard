<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PVP/β-CD/AzoIL Dashboard</title>
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="style.css?v=23">
</head>
<body>
  <div class="app">

    <!-- Header -->
    <header>
      <div>
        <h1>PVP / β-CD / AzoIL Project</h1>
        <p class="subtitle">實驗數據視覺化儀表板</p>
      </div>
      <div class="header-actions">
        <span id="statusBadge" class="badge badge-gray">檢查連線中…</span>
        <button id="refreshBtn" class="btn btn-primary">⟳ 從 Notion 更新</button>
      </div>
    </header>

    <!-- Tab Navigation -->
    <nav class="tabs">
      <button class="tab-btn active" data-tab="tensile">📈 拉力</button>
      <button class="tab-btn" data-tab="electrical">⚡ 電性</button>
      <button class="tab-btn" data-tab="dsc">🌡️ DSC</button>
    </nav>

    <!-- Main Content -->
    <main>

      <!-- ===== 拉力 Tab ===== -->
      <div id="tab-tensile" class="tab-content active">

        <!-- LEFT COLUMN: Sample Selector + Tag Panel -->
        <div class="t-left-col">

          <aside class="t-left">
            <div class="tl-block">
              <div class="tl-label">View Mode</div>
              <div class="mode-btns" id="modeBtns">
                <button class="mode-btn active" data-mode="single">
                  <span class="mode-icon">◉</span> Single
                </button>
                <button class="mode-btn" data-mode="overlay">
                  <span class="mode-icon">⊕</span> Overlay
                </button>
              </div>
            </div>

            <div class="tl-block tl-grow">
              <div class="tl-label">Sample Selection</div>
              <div id="file-selector"></div>
            </div>

            <div class="tl-block tl-upload">
              <div class="tl-label">Manual Upload</div>
              <input type="file" id="csvInput" accept=".csv" multiple>
              <button id="uploadBtn" class="btn btn-secondary btn-sm">Upload CSV</button>
              <div id="uploadStatus"></div>
            </div>
          </aside>

          <!-- DEDICATED TAG PANEL -->
          <div class="t-tag-panel">
            <div class="tag-panel-title">Tags</div>
            <div id="tag-section"></div>
          </div>

        </div>

        <!-- CENTER: Chart + Metrics -->
        <div class="t-center panel flex-col">
          <div class="chart-controls">
            <div class="chart-ctrl-right">
              <div class="btn-group">
                <button class="chart-btn chart-toggle active" id="chartToggleBtn" data-chart="stress-strain" data-tip="Switch chart type">Stress–Strain</button>
              </div>
              <div class="ctrl-divider"></div>
              <div class="custom-modebar" id="customModebar">
                <button class="mb-btn mb-toggle active" id="mbZoom" data-tip="Box Zoom" onclick="setDragMode('zoom')">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="12" height="12" rx="1.5"/><circle cx="17.5" cy="17.5" r="3.5"/><line x1="20.5" y1="20.5" x2="22" y2="22"/></svg>
                </button>
                <button class="mb-btn mb-toggle" id="mbPan" data-tip="Pan" onclick="setDragMode('pan')">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 9 2 12 5 15"/><polyline points="9 5 12 2 15 5"/><polyline points="15 19 12 22 9 19"/><polyline points="19 9 22 12 19 15"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/></svg>
                </button>
                <button class="mb-btn" data-tip="Zoom In" onclick="zoomChart(0.65)">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                </button>
                <button class="mb-btn" data-tip="Zoom Out" onclick="zoomChart(1.5)">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                </button>
                <button class="mb-btn" data-tip="Reset Axes" onclick="resetAxes()">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
                </button>
                <div class="ctrl-divider"></div>
                <button class="mb-btn" data-tip="Export to XLSX" onclick="exportToXLSX()">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
                </button>
                <button class="mb-btn" data-tip="Download PNG" onclick="downloadChart()">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
                </button>
                <div class="ctrl-divider" id="healingDivider" style="display:none"></div>
                <button class="mb-btn mb-toggle" id="mbHealing" data-tip="Self-Healing Efficiency" onclick="toggleHealingPanel()" style="display:none">
                  <span style="font-size:0.68rem;font-weight:700;letter-spacing:0;font-family:inherit">η%</span>
                </button>
              </div>
            </div>
          </div>
          <div id="chart-tensile" class="chart-area tensile-chart">
            <div class="empty-state">
              <span class="empty-icon">📂</span>
              <p>Loading data…</p>
            </div>
          </div>
          <div id="metrics-table"></div>
        </div>

      </div>

      <!-- ===== 電性 Tab ===== -->
      <div id="tab-electrical" class="tab-content">
        <div class="empty-panel">
          <span class="empty-icon">⚡</span>
          <h2>電性測量</h2>
          <p>Notion 「電性」頁面目前尚無資料。<br>待新增測量數據後，重新整理即可顯示。</p>
        </div>
      </div>

      <!-- ===== DSC Tab ===== -->
      <div id="tab-dsc" class="tab-content">
        <div class="empty-panel">
          <span class="empty-icon">🌡️</span>
          <h2>DSC 量熱分析</h2>
          <p>Notion 「DSC」頁面目前尚無資料。<br>待新增測量數據後，重新整理即可顯示。</p>
        </div>
      </div>

    </main>
  </div>

  <div id="healing-panel" class="healing-panel"></div>
  <script src="app.js?v=22"></script>
</body>
</html>
